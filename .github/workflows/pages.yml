name: Deploy c-bot static site to GitHub Pages (refresh)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload static public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: c-bot/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
